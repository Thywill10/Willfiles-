name: willfiles
description: "WillFiles - Smart File Manager"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  file_manager: ^1.0.2
  file_picker: ^10.3.2
  share_plus: ^11.1.0
  video_player: ^2.10.0
  just_audio: ^0.10.4
  photo_view: ^0.15.0
  flutter_pdfview: ^1.4.1+1
  provider: ^6.1.5
  intl: ^0.20.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/